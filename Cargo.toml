[workspace]
members = ["programs/*", "solana-qsim"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.89.0"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

# solana-qsim's fixed-point maths has documented, bounded ranges (Q1.30 amplitudes, i64/u128
# intermediates, indices < 2^20); overflow checks there only cost compute units.
[profile.release.package.solana-qsim]
overflow-checks = false
